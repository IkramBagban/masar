name: backend-deploy

# Builds the Express API (server/) into a Docker image, pushes it to
# Docker Hub, and runs it on the GCP VM. External Postgres via
# DATABASE_URL — no DB container.
#
# Required repo settings (IkramBagban/masar -> Settings -> Secrets/Variables):
#   vars:    DOCKERHUB_USERNAME
#   secrets: DOCKERHUB_TOKEN, VM_HOST, VM_USERNAME, VM_SSH_KEY,
#            DATABASE_URL, CLIENT_ORIGIN,
#            CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY,
#            CLERK_WEBHOOK_SIGNING_SECRET (add when prod Clerk app is ready)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ikrambagban/masar-server:${{ github.sha }}
            ikrambagban/masar-server:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ikrambagban/masar-server:${{ github.sha }}
            docker stop masar-server || true
            docker rm masar-server || true
            docker run -d \
              --name masar-server \
              --restart always \
              -p 127.0.0.1:3001:3001 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e PORT="3001" \
              -e CLIENT_ORIGIN="${{ secrets.CLIENT_ORIGIN }}" \
              -e CLERK_PUBLISHABLE_KEY="${{ secrets.CLERK_PUBLISHABLE_KEY }}" \
              -e CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}" \
              -e CLERK_WEBHOOK_SIGNING_SECRET="${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}" \
              ikrambagban/masar-server:${{ github.sha }}
            sleep 8
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3001/api/health; then
                exit 0
              fi
              echo "health check attempt $i/12 failed, retrying in 10s..."
              sleep 10
            done
            echo "backend never became healthy:"
            docker logs masar-server --tail 20 || true
            exit 1
