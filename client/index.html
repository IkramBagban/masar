<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Masār — know where to start. Describe symptoms in Arabic or English and get your next step."
    />
    <title>Masār — Know where to start</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Outfit:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var stored =
          localStorage.getItem("masar-locale") ||
          localStorage.getItem("wasit-lang");
        if (stored === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        } else {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
